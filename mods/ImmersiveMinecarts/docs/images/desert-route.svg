<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-labelledby="route-title route-desc">
	<title id="route-title">Desert minecart route</title>
	<desc id="route-desc">Three stages: survey the route, lay the tracks, and pass the final inspection, then the Calico Desert minecart.</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 10 5 0 10z" fill="#c9822f" />
		</marker>
	</defs>
	<rect width="820" height="230" rx="18" fill="#241a10" />
	<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
		<text x="32" y="42" fill="#f3d9a4" font-size="18" font-weight="700">Calico Desert route</text>
		<text x="32" y="64" fill="#9d8f78" font-size="13">Three deliveries, then the minecart opens.</text>

		<g>
			<rect x="32" y="90" width="210" height="104" rx="12" fill="#3a2a12" stroke="#c9822f" stroke-width="2" />
			<text x="52" y="124" fill="#f3d9a4" font-size="15" font-weight="700">1 · Survey</text>
			<text x="52" y="150" fill="#c9bda6" font-size="13">Scout the route and</text>
			<text x="52" y="170" fill="#c9bda6" font-size="13">pay the survey crew.</text>
		</g>

		<line x1="250" y1="142" x2="292" y2="142" stroke="#c9822f" stroke-width="2" marker-end="url(#arrow)" />
		<text x="271" y="132" fill="#9d8f78" font-size="11" text-anchor="middle">3d</text>

		<g>
			<rect x="300" y="90" width="210" height="104" rx="12" fill="#3a2a12" stroke="#c9822f" stroke-width="2" />
			<text x="320" y="124" fill="#f3d9a4" font-size="15" font-weight="700">2 · Lay tracks</text>
			<text x="320" y="150" fill="#c9bda6" font-size="13">Deliver rails and</text>
			<text x="320" y="170" fill="#c9bda6" font-size="13">build the line.</text>
		</g>

		<line x1="518" y1="142" x2="560" y2="142" stroke="#c9822f" stroke-width="2" marker-end="url(#arrow)" />
		<text x="539" y="132" fill="#9d8f78" font-size="11" text-anchor="middle">5d</text>

		<g>
			<rect x="568" y="90" width="220" height="104" rx="12" fill="#3a2a12" stroke="#c9822f" stroke-width="2" />
			<text x="588" y="124" fill="#f3d9a4" font-size="15" font-weight="700">3 · Inspection</text>
			<text x="588" y="150" fill="#c9bda6" font-size="13">Final delivery and</text>
			<text x="588" y="170" fill="#c9bda6" font-size="13">test run.</text>
		</g>

		<g transform="translate(732 196)">
			<rect x="0" y="0" width="52" height="22" rx="5" fill="#c9822f" />
			<rect x="6" y="5" width="40" height="6" rx="2" fill="#f3d9a4" />
			<circle cx="12" cy="26" r="6" fill="#e7e2d6" />
			<circle cx="40" cy="26" r="6" fill="#e7e2d6" />
			<circle cx="12" cy="26" r="2.5" fill="#241a10" />
			<circle cx="40" cy="26" r="2.5" fill="#241a10" />
		</g>
	</g>
</svg>
